[project]
name = "openboard"
version = "0.1.0"
description = "OpenBoard Economy — deterministic economic protocol engine (Open Board Market Socialism)"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
